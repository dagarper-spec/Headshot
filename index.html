<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d11">
<title>HEADSHOT — Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hide">
  <div id="sv"></div>
  <div id="hp"><i id="hpf"></i><span id="hpt">100</span></div>
  <div id="dalert">DRON TE VE</div>
  <div id="hel"></div><div id="shb"><i id="shf"></i><span id="shbt"></span></div>
  <div id="wv">OLEADA 1</div>
  <div id="sc"><b id="score">0</b><small id="combo"></small></div>
  <div id="ammo"><b id="mag">30</b><small id="rl"></small></div>
  <div id="xh"><i></i><i></i><i></i><i></i></div><div id="hm"></div><div id="vig"></div>
  <div id="streak"><b></b><span><u></u></span></div><div id="pop"></div><div id="ban"></div><div id="chestbar"><i></i></div>
<div id="warn"><i></i><i></i><i></i></div>
<div id="toast"></div>
  <div id="bPause">II</div>
</div>

<div id="touch" class="hide">
  <div class="pad" id="sL"><i></i></div>
  <div class="pad" id="sR"><i></i></div>
  <div class="btn" id="bZoom">MIRA</div>
  <div class="btn" id="bCrouch">AGACHAR</div>
  <div class="btn" id="bRel">R</div>
  <div class="btn" id="bSwap">CAMBIAR<br>ARMA</div>
  <div class="btn" id="bGren">EXPLO-<br>SIVO</div>
  <div class="btn" id="bZl">ZOOM<br>2</div>
</div>

<div id="menu" class="ov">
  <button id="cfgBtn" class="gear" aria-label="Ajustes">&#9881;</button>
  <div class="cover"><div class="scope"><i></i><i></i></div>
    <h1 id="mtitle">HEADSHOT</h1><p class="tag">UN DISPARO · UNA CABEZA</p>
    <p id="best" class="best"></p></div>
  <div class="mbtns">
    <button id="start" class="big play" disabled>Cargando…</button>
    <button id="cont" class="big alt hide"></button>
    <div class="row3">
      <button id="endBtn" class="big alt inf">Infinito</button>
      <button id="lvlBtn" class="big alt">Niveles</button>
      <button id="menuShop" class="big alt hide">Tienda</button>
    </div>
    <button id="restart" class="big alt hide">Reiniciar nivel</button>
  </div>
</div>

<div id="cfg" class="ov hide">
  <h1>AJUSTES</h1>
  <div class="opts">
    <label class="q">Calidad
      <select id="quality">
        <option value="auto">Auto</option><option value="high">Alta</option>
        <option value="medium">Media</option><option value="low">Baja</option>
      </select>
    </label>
    <label class="q">Sangre <select id="blood"><option value="normal">Normal</option><option value="low">Reducida</option><option value="off">Apagada</option></select></label>
    <label class="q">Música <select id="music"><option value="1">Sí</option><option value="0">No</option></select></label>
  </div>
  <button id="resetAll" class="big alt small">Reiniciar todo el progreso</button>
  <button id="cfgBack" class="big alt">Volver</button>
</div>

<div id="endless" class="ov hide">
  <h1>INFINITO</h1>
  <p class="tag">Oleadas sin fin. Sobrevive y encadena rachas.</p>
  <div id="endList"></div>
  <button id="endBack" class="big alt">Volver</button>
</div>

<div id="equip" class="ov hide">
  <h1>EQUIPAMIENTO</h1><p class="tag">Elige tu equipo para la misión</p>
  <div id="equipBody"></div>
  <div class="mbtns"><button id="eqGo" class="big play">A la misión</button><button id="eqBack" class="big alt">Atrás</button></div>
</div>

<div id="shop" class="ov hide">
  <h1>TIENDA</h1>
  <div id="coins"></div>
  <div id="shopTabs"></div>
  <div id="items"></div>
  <button id="shopBack" class="big">Volver</button>
</div>

<div id="levels" class="ov hide shopish">
  <h1>NIVELES</h1>
  <div id="lvlInfo" class="sub"></div>
  <div id="lvlList"></div>
  <button id="lvlBack" class="big">Volver</button>
</div>

<div id="over" class="ov hide">
  <h1 id="ot">HAS CAÍDO</h1>
  <p id="ostats" class="sub"></p>
  <button id="again" class="big">Jugar de nuevo</button>
  <button id="shopBtn" class="big alt hide">Tienda</button>
  <button id="lvlOver" class="big alt hide">Niveles</button>
  <button id="homeBtn" class="big alt">Menú principal</button>
</div>

<script>
/* Aviso si el juego no llega a cargar (módulos bloqueados, sin conexión, abierto como archivo...) */
(function () {
  function show(m) { var p = document.createElement('p'); p.className = 'err'; p.textContent = m; document.getElementById('menu').appendChild(p); }
  addEventListener('error', function (e) { show('Error: ' + (e.message || 'al cargar')); });
  addEventListener('unhandledrejection', function (e) { show('Error: ' + ((e.reason && e.reason.message) || e.reason)); });
  setTimeout(function () {
    if (document.getElementById('start').disabled) show('No se ha podido cargar el juego. Ábrelo desde su dirección web (no como archivo) y comprueba tu conexión.');
  }, 7000);
})();
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
